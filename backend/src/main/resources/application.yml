server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yujing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-test}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 60000

jwt:
  secret: yujing-travel-secret-key-2024-at-least-256-bits-long-for-hs256
  expire: 86400000

poster:
  upload-path: ./posters/
