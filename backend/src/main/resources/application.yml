server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yujing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    # 密钥不入库明文：本地默认值保留，生产环境用 DB_PASSWORD 环境变量覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-test}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 60000

jwt:
  # 生产环境请用 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:yujing-travel-secret-key-2024-at-least-256-bits-long-for-hs256}
  expire: 86400000

poster:
  upload-path: ./posters/
